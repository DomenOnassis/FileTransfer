name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build server
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Deploy
        run: |
          rsync -a --delete client/build/ /var/www/filetransfer/
          rsync -a --delete server/build/ /opt/filetransfer/server/build/
          cp server/package.json server/package-lock.json /opt/filetransfer/server/
          cd /opt/filetransfer/server && npm ci --omit=dev
          sudo systemctl restart filetransfer